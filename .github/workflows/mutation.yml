name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build mutago
        run: go build -o /usr/local/bin/mutago ./cmd/mutago

      - name: Run mutation testing
        # Scoped to packages with isolated unit tests.
        # Excluded:
        #   cmd/               - integration tests re-invoke the binary (would recurse)
        #   internal/importing  - resolution behaviour depends on GOPATH layout; excluded from mutation targets
        #   internal/parser     - excluded from mutation targets (type-checker setup is test-infrastructure, not user logic)
        # --coverage generates a profile before mutation to compute covered-code MSI
        # and marks mutants in untested code as "not covered" rather than running them.
        # --min-msi and --min-covered-msi enforce quality gates.
        run: |
          mutago \
            --exec-timeout 30 \
            --coverage \
            --min-msi 75 \
            --min-covered-msi 80 \
            github.com/quality-gates/mutago/v2/mutator/arithmetic \
            github.com/quality-gates/mutago/v2/mutator/branch \
            github.com/quality-gates/mutago/v2/mutator/composite \
            github.com/quality-gates/mutago/v2/mutator/concurrency \
            github.com/quality-gates/mutago/v2/mutator/conditional \
            github.com/quality-gates/mutago/v2/mutator/expression \
            github.com/quality-gates/mutago/v2/mutator/loop \
            github.com/quality-gates/mutago/v2/mutator/numbers \
            github.com/quality-gates/mutago/v2/mutator/select \
            github.com/quality-gates/mutago/v2/mutator/statement \
            github.com/quality-gates/mutago/v2/internal/filter \
            github.com/quality-gates/mutago/v2/internal/coverage \
            github.com/quality-gates/mutago/v2/internal/gitdiff \
            github.com/quality-gates/mutago/v2/internal/models
