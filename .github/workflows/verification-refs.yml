name: Verification guide references

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verification-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch target branch
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: git fetch origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
      - name: Test reference check
        run: python3 -m unittest discover -s scripts -p 'test_check_verification_refs.py' -v
      - name: Check verification guide references
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: python3 scripts/check-verification-refs.py "origin/$BASE_BRANCH"
